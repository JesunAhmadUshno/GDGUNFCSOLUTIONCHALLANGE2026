app:
  - changed-files:
      - any-glob-to-any-file: ["src/**", "public/**", "next.config.js"]
dashboard:
  - changed-files:
      - any-glob-to-any-file: ["site/**"]
scripts:
  - changed-files:
      - any-glob-to-any-file: ["scripts/**"]
automation:
  - changed-files:
      - any-glob-to-any-file: [".github/**"]
docs:
  - changed-files:
      - any-glob-to-any-file: ["docs/**", "README.md", "**/*.md"]
