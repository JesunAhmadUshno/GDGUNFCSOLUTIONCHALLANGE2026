name: CI

# Pull request gate. Deployment moved to pages.yml, which builds the directory
# and the dashboard together (Pages accepts only one artifact).
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - run: npm ci && npm test && npm run build
      - run: npm ci && npm run build
        working-directory: site
